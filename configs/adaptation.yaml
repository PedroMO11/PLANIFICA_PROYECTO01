# Experimento central de olvido por ventanas fijas. F4 del plan.

strategies:
  - {name: S0,  kind: static,    window_days: null, role: referencia_no_desplegable}
  - {name: E15, kind: expanding, window_days: null, role: referencia_no_desplegable}
  - {name: W30, kind: sliding,   window_days: 30,   role: desplegable}
  - {name: W60, kind: sliding,   window_days: 60,   role: desplegable}
  - {name: W90, kind: sliding,   window_days: 90,   role: desplegable}

# En T=120, W90/E15/S0 comparten exactamente el mismo paquete (mismos datos, config y seed):
# se cuenta como 1 fit fisico, no 3. Ver §"Costo de computo" del plan.
share_initial_package: [S0, E15, W90]

detectors:
  ks_psi:
    reference: development          # referencia fija de desarrollo
    window_days: 7                  # ultimos 7 dias de X
    schedule: daily
    psi_alert: 0.20
    ks_alert: 0.10
    bh_q: 0.05                      # correccion Benjamini-Hochberg
    panel_max_numeric: 20           # por completitud/varianza en desarrollo
    consecutive_closes: 2           # alerta requiere dos cierres consecutivos
    panel_fraction_alert: 0.20      # en >=20% del panel
    epsilon: 1.0e-6

  domain_classifier:                # S1
    schedule: per_block             # una ejecucion por T, maximo 4 fits
    reference_interval: [0, 60]
    recent_window_days: 7
    cap_per_domain: 2000
    inner_split: 0.70               # cronologico dentro de cada dominio
    auc_alert: 0.75
    forbidden_features: [isFraud, TransactionID, TransactionDT, dia, semana]

  score_psi:                        # S2
    reference: own_calibration_scores
    psi_alert: 0.20

  analyst:                          # S3
    simulated: true
    only_after_maturity: true       # C28
    usable_as_ground_truth: false

  adwin:
    delta: 0.002
    clock: 32
    signal: brier_individual        # (p_emitida - y)^2
    one_detector_per_version: true
    update_once_per_matured_label: true

adwin_selftest:
  n_obs: 2000
  seed: 42
  streams: [stationary, jump]       # salto conocido de perdidas acotadas
  jump_at: 1000

bootstrap:
  n_resamples: 200
  block_days: 7                     # bloques contiguos, remuestreo pareado
  confidence: 0.95

# El benchmark nocturno usa autorizacion humana previa y enumerada (C23).
# Ninguna alerta despliega por si sola: alerta -> recomendacion -> gate humano.
authorization:
  require_manifest: true
  simulated_promotions_labeled: true
