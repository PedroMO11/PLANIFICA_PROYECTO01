<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1020" width="1440" height="1020"
     font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Ciclo de vida de un sistema adaptativo de decisión ante fraude</title>
  <desc>Seis estaciones del ciclo de vida, con la separación entre lo observable hoy
        y la etiqueta que se confirma treinta días después.</desc>

  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/>
    </marker>
    <marker id="flechaHumano" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"/>
    </marker>
    <style>
      .titulo      { font-size: 30px; font-weight: 700; fill: #0b0b0b; }
      .subtitulo   { font-size: 15px; fill: #52514e; }
      .estacion    { font-size: 17px; font-weight: 700; fill: #0b0b0b; }
      .numero      { font-size: 20px; font-weight: 700; fill: #ffffff; }
      .cuerpo      { font-size: 13px; fill: #2f2e2c; }
      .dato        { font-size: 13px; font-weight: 700; fill: #0b0b0b; }
      .nota        { font-size: 11.5px; fill: #6b6a66; }
      .centro      { font-size: 17px; font-weight: 700; fill: #0b0b0b; }
      .centroTexto { font-size: 13px; fill: #2f2e2c; }
      .leyenda     { font-size: 12.5px; fill: #52514e; }
      .humano      { font-size: 12.5px; font-weight: 700; fill: #eb6834; }
      .caja        { fill: #ffffff; stroke-width: 2; rx: 12; }
    </style>
  </defs>

  <rect width="1440" height="1020" fill="#fcfcfb"/>

  <!-- Encabezado -->
  <text class="titulo" x="48" y="56">Sistema adaptativo de decisión ante fraude transaccional</text>
  <text class="subtitulo" x="48" y="84">
    Ciclo de vida completo · IEEE-CIS · ventana de olvido W30, cadencia 15 días, etiqueta a 30 días
  </text>
  <line x1="48" y1="102" x2="1392" y2="102" stroke="#e3e2de" stroke-width="2"/>

  <!-- ====================== ESTACIÓN 1: INICIACIÓN ====================== -->
  <rect class="caja" x="48" y="130" width="400" height="196" stroke="#2a78d6"/>
  <circle cx="82" cy="164" r="19" fill="#2a78d6"/>
  <text class="numero" x="82" y="171" text-anchor="middle">1</text>
  <text class="estacion" x="114" y="170">Iniciación: decidir, no solo predecir</text>
  <text class="cuerpo" x="72" y="202">Tres acciones por transacción:</text>
  <text class="dato"   x="72" y="224">APROBAR · REVISAR · BLOQUEAR</text>
  <text class="cuerpo" x="72" y="250">La decisión minimiza el costo esperado:</text>
  <text class="cuerpo" x="72" y="272">E[aprobar]=p·monto   E[bloquear]=(1−p)·c_FP</text>
  <text class="cuerpo" x="72" y="292">E[revisar]=c_R+p(1−r_H)monto+(1−p)f_H·c_FP</text>
  <text class="nota"   x="72" y="314">Objetivos O1–O5 · cupo duro de 150 revisiones/día</text>

  <!-- ====================== ESTACIÓN 2: DATOS ====================== -->
  <rect class="caja" x="520" y="130" width="400" height="196" stroke="#1baf7a"/>
  <circle cx="554" cy="164" r="19" fill="#1baf7a"/>
  <text class="numero" x="554" y="171" text-anchor="middle">2</text>
  <text class="estacion" x="586" y="170">Datos: dos fuentes, cero fuga</text>
  <text class="cuerpo" x="544" y="202">transacciones + identidad → join 1:1 auditado</text>
  <text class="dato"   x="544" y="224">581 972 eventos · 182 días · 24 % con identidad</text>
  <text class="cuerpo" x="544" y="250">Features solo del pasado, por proxy de entidad:</text>
  <text class="cuerpo" x="544" y="270">ventanas de 1 h, 24 h y 7 d · emitidas antes de</text>
  <text class="cuerpo" x="544" y="290">actualizar el estado</text>
  <text class="nota"   x="544" y="314">12 pruebas automáticas verifican la causalidad</text>

  <!-- ====================== ESTACIÓN 3: MODELADO ====================== -->
  <rect class="caja" x="992" y="130" width="400" height="196" stroke="#4a3aa7"/>
  <circle cx="1026" cy="164" r="19" fill="#4a3aa7"/>
  <text class="numero" x="1026" y="171" text-anchor="middle">3</text>
  <text class="estacion" x="1058" y="170">Modelado y calibración</text>
  <text class="cuerpo" x="1016" y="202">Logística · Random Forest · LightGBM</text>
  <text class="cuerpo" x="1016" y="224">Cada versión tiene su propio calibrador Platt,</text>
  <text class="cuerpo" x="1016" y="244">ajustado en 7 días que el predictor no vio.</text>
  <text class="dato"   x="1016" y="270">Sin calibrar, p·monto no significa nada</text>
  <text class="cuerpo" x="1016" y="292">Umbrales por costo, nunca 0.5</text>
  <text class="nota"   x="1016" y="314">ECE 0,0046 → 0,0010 tras calibrar</text>

  <!-- ====================== CENTRO: LOS DOS RELOJES ====================== -->
  <rect x="404" y="382" width="632" height="176" rx="16" fill="#fff8f2" stroke="#eb6834" stroke-width="3"/>
  <text class="centro" x="720" y="418" text-anchor="middle">
    El hecho que gobierna todo el diseño
  </text>
  <text class="centroTexto" x="720" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#eb6834">
    X es observable hoy; la etiqueta y se confirma 30 días después
  </text>
  <line x1="440" y1="472" x2="1000" y2="472" stroke="#f0d5c2" stroke-width="1.5"/>
  <text class="centroTexto" x="440" y="498">
    <tspan font-weight="700">Reloj de evento:</tspan> cuándo ocurrió la transacción → qué features son visibles
  </text>
  <text class="centroTexto" x="440" y="520">
    <tspan font-weight="700">Reloj de disponibilidad:</tspan> día + 30 → cuándo la etiqueta puede entrenar o medir
  </text>
  <text class="nota" x="440" y="544">
    Nada se entrena, se calibra ni se evalúa con una etiqueta que todavía no maduró.
  </text>

  <!-- Flechas del ciclo: 1→2→3 arriba -->
  <path d="M 448 228 L 512 228" stroke="#52514e" stroke-width="2" fill="none" marker-end="url(#flecha)"/>
  <path d="M 920 228 L 984 228" stroke="#52514e" stroke-width="2" fill="none" marker-end="url(#flecha)"/>
  <!-- 3 → 4 (baja por la derecha) -->
  <path d="M 1192 326 L 1192 660" stroke="#52514e" stroke-width="2" fill="none" marker-end="url(#flecha)"/>
  <!-- 6 → 1 (sube por la izquierda, cierra el ciclo) -->
  <path d="M 248 660 L 248 326" stroke="#52514e" stroke-width="2" fill="none" marker-end="url(#flecha)"/>

  <!-- ====================== ESTACIÓN 4: EVALUACIÓN ====================== -->
  <rect class="caja" x="48" y="672" width="400" height="212" stroke="#eda100"/>
  <circle cx="82" cy="706" r="19" fill="#eda100"/>
  <text class="numero" x="82" y="713" text-anchor="middle">4</text>
  <text class="estacion" x="114" y="712">Evaluación: tres familias</text>
  <text class="cuerpo" x="72" y="744"><tspan font-weight="700">Técnica</tspan> · AP, F1, recall@FPR1%, recall@prec80%, Brier</text>
  <text class="cuerpo" x="72" y="768"><tspan font-weight="700">Decisión</tspan> · UM/transacción, fraude evitado, cupo usado</text>
  <text class="cuerpo" x="72" y="792"><tspan font-weight="700">Social</tspan> · bloqueo de legítimas por segmento, con soporte</text>
  <text class="cuerpo" x="72" y="822">Cuatro bloques de test, evaluación prequential:</text>
  <text class="cuerpo" x="72" y="842">se predice antes de revelar la etiqueta.</text>
  <text class="nota"   x="72" y="868">Intervalos por bootstrap de bloques de 7 días</text>

  <!-- ====================== ESTACIÓN 5: DESPLIEGUE ====================== -->
  <rect class="caja" x="520" y="672" width="400" height="212" stroke="#e87ba4"/>
  <circle cx="554" cy="706" r="19" fill="#e87ba4"/>
  <text class="numero" x="554" y="713" text-anchor="middle">5</text>
  <text class="estacion" x="586" y="712">Despliegue y operación</text>
  <text class="cuerpo" x="544" y="744">Servicio HTTP + replay con ledger transaccional.</text>
  <text class="cuerpo" x="544" y="768">El servicio calcula; el replay confirma y reserva</text>
  <text class="cuerpo" x="544" y="788">el cupo de forma atómica e idempotente.</text>
  <text class="dato"   x="544" y="816">p95 = 66 ms · cupo 150/150 · 3 acciones reales</text>
  <text class="cuerpo" x="544" y="842">Sin modelo válido: HTTP 503 y pausa.</text>
  <text class="nota"   x="544" y="868">GCP queda como propuesta; el equipo despliega a mano</text>

  <!-- ====================== ESTACIÓN 6: MONITOREO ====================== -->
  <rect class="caja" x="992" y="672" width="400" height="212" stroke="#e34948"/>
  <circle cx="1026" cy="706" r="19" fill="#e34948"/>
  <text class="numero" x="1026" y="713" text-anchor="middle">6</text>
  <text class="estacion" x="1058" y="712">Monitoreo y adaptación</text>
  <text class="cuerpo" x="1016" y="744"><tspan font-weight="700">Hoy:</tspan> KS/PSI y domain classifier → cambio en P(X)</text>
  <text class="cuerpo" x="1016" y="768"><tspan font-weight="700">A 30 días:</tspan> ADWIN sobre el error real → P(y|X)</text>
  <text class="cuerpo" x="1016" y="796">Reentrenamiento con ventana fija cada 15 días.</text>
  <text class="dato"   x="1016" y="822">W30 · −34,5 % de costo frente al modelo estático</text>
  <text class="humano" x="1016" y="848">Toda promoción exige aprobación humana</text>
  <text class="nota"   x="1016" y="870">Ninguna alerta despliega por sí sola</text>

  <!-- Flechas inferiores: 4→5→6 -->
  <path d="M 448 778 L 512 778" stroke="#52514e" stroke-width="2" fill="none" marker-end="url(#flecha)"/>
  <path d="M 920 778 L 984 778" stroke="#52514e" stroke-width="2" fill="none" marker-end="url(#flecha)"/>

  <!-- Gate humano, destacado entre 6 y 1 -->
  <rect x="404" y="586" width="632" height="52" rx="10" fill="#fff3e0" stroke="#eb6834" stroke-width="2"/>
  <text class="humano" x="720" y="609" text-anchor="middle" font-size="14">
    GATE HUMANO · reentrenar y promover requieren autorización registrada
  </text>
  <text class="nota" x="720" y="628" text-anchor="middle">
    integridad → costo ≤ champion → sin brecha social &gt; 2 pp → firma del responsable
  </text>
  <path d="M 1192 660 L 1044 612" stroke="#eb6834" stroke-width="2" fill="none" marker-end="url(#flechaHumano)"/>
  <path d="M 396 612 L 248 660" stroke="#eb6834" stroke-width="2" fill="none" marker-end="url(#flechaHumano)"/>

  <!-- ====================== LEYENDA ====================== -->
  <line x1="48" y1="912" x2="1392" y2="912" stroke="#e3e2de" stroke-width="2"/>
  <text class="leyenda" x="48" y="938" font-weight="700">Leyenda de la evidencia</text>

  <rect x="48" y="952" width="13" height="13" rx="3" fill="#1baf7a"/>
  <text class="leyenda" x="70" y="963">Medido en esta entrega y verificado con pruebas</text>

  <rect x="430" y="952" width="13" height="13" rx="3" fill="#eda100"/>
  <text class="leyenda" x="452" y="963">Simulado bajo supuestos declarados (costos, analista)</text>

  <rect x="856" y="952" width="13" height="13" rx="3" fill="#9e9e9e"/>
  <text class="leyenda" x="878" y="963">Diseño futuro, no implementado (nube, multimodalidad)</text>

  <text class="nota" x="48" y="990">
    Límites: los costos son simulados y no representan un ahorro causal · la disparidad es operativa, no demográfica ·
    el cupo se garantiza para un orquestador secuencial · es un backtest retrospectivo, no una validación prospectiva.
  </text>
  <text class="nota" x="48" y="1008" font-weight="700" fill="#e34948">
    Los resultados de esta corrida provienen de un dataset sustituto sintético: no son cifras de IEEE-CIS.
  </text>
</svg>
